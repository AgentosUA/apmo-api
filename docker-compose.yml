# API + RustFS (S3-compatible storage for avatars, squad logos & mission images).
#
#   cp .env.example .env   # fill DB_URL, JWT_SECRET, S3_SECRET_KEY...
#   docker compose up -d --build
#
# API:             http://localhost:${API_PORT}/api
# RustFS S3 API:   http://localhost:${S3_PORT}  (avatars: /user-avatars/<userId>/<uuid>.webp)
#                  (mission images: /mission-images/<hash[0:2]>/<sha256>.webp)
# RustFS console:  http://localhost:${S3_UI_PORT}/rustfs/console/
#
# Pin a version in production with RUSTFS_IMAGE, e.g. rustfs/rustfs:<tag>.

name: ${COMPOSE_PROJECT_NAME:-apmo}

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-apmo}-api
    # Secrets come from .env at runtime; .env is excluded from the image (.dockerignore).
    env_file: .env
    environment:
      # API → RustFS inside the docker network. Public URLs are built from
      # S3_PUBLIC_URL (set it in production) or localhost:${S3_PORT}.
      - S3_ENDPOINT=http://rustfs:9000
      - S3_PUBLIC_URL=${S3_PUBLIC_URL:-http://localhost:${S3_PORT:-9000}}
    ports:
      - ${API_PORT:-3000}:3000
    depends_on:
      rustfs:
        condition: service_started
    networks:
      - apmo-network
    restart: unless-stopped

  # RustFS runs as uid 10001: give it ownership of the data volume before it starts.
  rustfs-perms:
    container_name: ${COMPOSE_PROJECT_NAME:-apmo}-rustfs-perms
    image: alpine:3
    user: root
    command: chown -R 10001:10001 /data
    volumes:
      - rustfs-data:/data
    restart: 'no'

  rustfs:
    container_name: ${COMPOSE_PROJECT_NAME:-apmo}-rustfs
    image: ${RUSTFS_IMAGE:-rustfs/rustfs:latest}
    environment:
      - RUSTFS_ACCESS_KEY=${S3_ACCESS_KEY:-apmo}
      - RUSTFS_SECRET_KEY=${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}
      - RUSTFS_VOLUMES=/data
      - RUSTFS_ADDRESS=0.0.0.0:9000
      - RUSTFS_CONSOLE_ADDRESS=0.0.0.0:9001
      - RUSTFS_CONSOLE_ENABLE=true
      - RUSTFS_OBS_LOGGER_LEVEL=error
    ports:
      - ${S3_PORT:-9000}:9000
      - ${S3_UI_PORT:-9001}:9001
    depends_on:
      rustfs-perms:
        condition: service_completed_successfully
    networks:
      - apmo-network
    restart: unless-stopped
    volumes:
      - rustfs-data:/data

networks:
  apmo-network:
    name: ${COMPOSE_PROJECT_NAME:-apmo}-network
    driver: bridge

volumes:
  rustfs-data:
