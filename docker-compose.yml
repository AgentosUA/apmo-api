# API + MinIO (avatars storage), same layout as asp-api.
#
#   cp .env.example .env   # fill DB_URL, JWT_SECRET, MINIO_ROOT_PASSWORD (min 8 chars)...
#   docker compose up -d --build
#
# API:            http://localhost:${API_PORT}/api
# MinIO S3 API:   http://localhost:${MINIO_PORT}  (avatars: /user-avatars/<userId>/<uuid>.webp)
# MinIO console:  http://localhost:${MINIO_UI_PORT}
#
# minio/minio was removed from Docker Hub after MinIO Community Edition was archived,
# so a maintained build is used by default. Override with MINIO_IMAGE, e.g.
# quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z (last official community build).

name: ${COMPOSE_PROJECT_NAME:-apmo}

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-apmo}-api
    # Secrets come from .env at runtime; .env is excluded from the image (.dockerignore).
    env_file: .env
    environment:
      # API → MinIO inside the docker network. Public URLs are built from
      # MINIO_PUBLIC_URL (set it in production) or localhost:${MINIO_PORT}.
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_USE_SSL=false
      - MINIO_PUBLIC_URL=${MINIO_PUBLIC_URL:-http://localhost:${MINIO_PORT:-9000}}
    ports:
      - ${API_PORT:-3000}:3000
    depends_on:
      minio:
        condition: service_started
    networks:
      - apmo-network
    restart: unless-stopped

  minio:
    container_name: ${COMPOSE_PROJECT_NAME:-apmo}-minio
    image: ${MINIO_IMAGE:-cgr.dev/chainguard/minio:latest}
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-apmo}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env (min 8 chars)}
    command: server /data --console-address ":9001"
    ports:
      - ${MINIO_PORT:-9000}:9000
      - ${MINIO_UI_PORT:-9001}:9001
    networks:
      - apmo-network
    restart: unless-stopped
    volumes:
      - minio-data:/data

networks:
  apmo-network:
    name: ${COMPOSE_PROJECT_NAME:-apmo}-network
    driver: bridge

volumes:
  minio-data:
